[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rutafeol-kv_cache_reuse_distribution_profile"
version = "0.1.0"
description = "抽取数值做分布分析，用中位数绝对偏差识别AI 工程效率工具工程师·KV Cache 复用与前缀共享上的离群点"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "rutafeol" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://rutafeol.github.io"
Repository = "https://github.com/rutafeol/kv_cache_reuse_distribution_profile"
Issues = "https://github.com/rutafeol/kv_cache_reuse_distribution_profile/issues"

[project.scripts]
kv_cache_reuse_distribution_profile = "kv_cache_reuse_distribution_profile:main"

[tool.setuptools]
py-modules = ["kv_cache_reuse_distribution_profile"]
